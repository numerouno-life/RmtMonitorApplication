server:
  port: 8083

spring:
  application:
    name: monitoring-service

  datasource:
    url: jdbc:postgresql://postgres:5432/rmt-platform?currentSchema=schema_monitoring
    username: ${DB_USERNAME:rmt_admin}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: schema_monitoring

  # Кеширование для DTO агрегатов (чтобы не дёргать другой сервис каждые 5 сек)
  cache:
    type: caffeine
    cache-names: aggregates
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

# Modbus: только ЧТЕНИЕ телеметрии (не управление!)
modbus:
  host: ${MODBUS_HOST:192.168.1.100}
  port: ${MODBUS_PORT:502}
  polling-interval: 5000
  read-timeout: 3000  # таймаут чтения
  connection-timeout: 5000  # таймаут соединения
  retry-attempts: 3  # попыток при ошибке

# Feign: вызовы к aggregate-control-service за инфо об агрегатах
feign:
  client:
    config:
      aggregate-controller-service:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

services:
  aggregate-controller-service:
    url: http://aggregate-control-service:8082

# Grafana: read-only пользователь для прямого подключения к БД
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m  # шаг сбора метрик

logging:
  level:
    root: INFO
    ru.practicum.monitoring: DEBUG