spring:
  datasource:
    # Локально подключаемся к localhost, а не к контейнеру
    url: jdbc:postgresql://localhost:5432/rmt-platform?currentSchema=${spring.jpa.properties.hibernate.default_schema}&stringtype=unspecified

  # Включаем вывод SQL для отладки
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG