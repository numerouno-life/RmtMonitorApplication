databaseChangeLog:
  # ===== ТАБЛИЦА ПОЛЬЗОВАТЕЛЕЙ =====
  - changeSet:
      id: create-auth-table
      author: Numerouno_life
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
              schemaName: schema_auth
      changes:
        - createTable:
            tableName: users
            schemaName: schema_auth
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: personnel_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(249)
                  constraints:
                    unique: true
              - column:
                  name: role
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(100)
                  constraints:
                    nullable: false